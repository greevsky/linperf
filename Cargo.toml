[package]
name = "linji"
version = "0.3.0"
edition = "2021"
authors = ["lei <mr.greevsky@gmail.com>"]
description = "我放在一台 Linux 上的综合工具：硬件、进程、容器、防火墙、网络、日志"
repository = "https://github.com/greevsky/linperf"
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(linji_ebpf)"] }

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
inferno = "0.11"
libc = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
